<!DOCTYPE html>
<html>
<head>
    <title>Personal Expense Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Personal Expense Calculator</h1>

        <!-- Income -->
        <h2>Income</h2>

        <label>Monthly Income:</label>
        <input type="number" id="income" placeholder="Enter income">

        <!-- Expense Details -->
        <h2>Add Expense</h2>

        <label>Expense Name:</label>
        <input type="text" id="expenseName" placeholder="Example: Food">

        <label>Category:</label>
        <select id="category">
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Education">Education</option>
            <option value="Shopping">Shopping</option>
            <option value="Other">Other</option>
        </select>

        <label>Amount:</label>
        <input type="number" id="amount" placeholder="Enter amount">

        <button onclick="addExpense()">Add Expense</button>

        <!-- Expense List -->
        <h2>Expense List</h2>

        <table>
            <thead>
                <tr>
                    <th>Expense</th>
                    <th>Category</th>
                    <th>Amount</th>
                </tr>
            </thead>

            <tbody id="expenseTable">
            </tbody>
        </table>

        <!-- Summary -->
        <h2>Summary Report</h2>

        <p>Income: ₹<span id="displayIncome">0</span></p>

        <p>Total Expenses: ₹<span id="totalExpense">0</span></p>

        <p>Savings: ₹<span id="savings">0</span></p>

        <h3>Category Summary</h3>

        <p>Food: ₹<span id="food">0</span></p>
        <p>Travel: ₹<span id="travel">0</span></p>
        <p>Education: ₹<span id="education">0</span></p>
        <p>Shopping: ₹<span id="shopping">0</span></p>
        <p>Other: ₹<span id="other">0</span></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
